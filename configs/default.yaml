# Every tunable parameter, with units. Source of truth for defaults.
# Changing a default requires an entry in docs/DECISIONS.md.

engine:
  mode: risk                    # risk | monitor_only  (monitor_only if Gate C fails)
  include_goalkeepers: false
  feature_tick_s: 10            # feature update cadence
  risk_tick_s: 60               # risk update cadence
  blanking_delta_s: 60          # delta: features at t use data <= t - delta (docs/02_MATH.md §3)
  rr_max: 4.0                   # engine safety bound on relative risk
  interval_draws: 1000          # Laplace posterior draws per update
  interval_level: 0.90
  default_stoppage_1h_min: 2.0
  default_stoppage_2h_min: 3.0
  horizon_min: 15

prematch:
  match_share_prior: 0.6        # a0 in docs/02_MATH.md §1
  band_cutoffs:                 # thresholds on r_usual at kick-off for display bands
    watch: 0.012
    high: 0.020

features:
  smoothing_window_s: 1.0       # Savitzky-Golay window
  smoothing_polyorder: 2
  max_plausible_speed_mps: 12.0
  hsr_threshold_mps: 5.5        # 19.8 km/h
  sprint_threshold_mps: 7.0     # 25.2 km/h
  effort_min_duration_s: 1.0
  effort_merge_gap_s: 0.5
  nearmax_fraction: 0.85
  windows_min: [1, 5, 10, 15]
  main_features: [hsr_5m, spr_5m, recovery_10m, hir_drop_15m, nearmax_cum, disrupt_5m]
  z_clip: 4.0

norms:
  kappa_matches: 5              # empirical-Bayes prior weight, against Kish effective matches
  min_matches_for_own_norm: 1
  recency_half_life_matches: 10 # w = 2^(-age / half_life), age in matches
  spread_windows_per_band: 3    # non-overlapping 5-min windows per 15-min band for the SD
  reset_after_absence_days: 14  # days lost to injury that trigger a norm reset
  reset_after_no_match_days: 42 # days without a match that trigger a norm reset
  reset_matches: 3              # matches after return with own norm capped at one match
  reset_own_weight_matches: 1.0 # effective matches allowed for his own norm during a reset
  log1p_transform: [hsr_5m, spr_5m, nearmax_cum]
  log_transform: [recovery_10m, hir_drop_15m]

quality:
  min_coverage: 0.7             # share of window with valid samples
  min_identity: 0.8
  stale_grey_s: 60
  stale_hide_s: 180

model:
  interval_min: 1.0
  congestion_interaction: false
  priors:
    alpha_sd: 0.5
    theta_sd: 0.5605            # ln(3)/1.96
    eta_sd: 0.5
    beta_sd: 0.3537             # ln(2)/1.96
  interval_audit:               # once per model version (docs/02_MATH.md §5)
    proposal_df: 5              # Student-t proposal around the Laplace fit
    draws: 4000
    khat_max: 0.7               # Pareto k diagnostic threshold
    quantile_rel_tol: 0.10      # IS vs Laplace 5th/95th percentiles of P15 and R_rest
    battery_matches: 200
  reliability:                  # rho_k; 1.0 until Study 1 measures them
    hsr_5m: 1.0
    spr_5m: 1.0
    recovery_10m: 1.0
    hir_drop_15m: 1.0
    nearmax_cum: 1.0
    disrupt_5m: 1.0

alerts:
  check:
    rr_min: 1.5
    persist_updates: 2
    r_rest_floor: 0.004
  discuss:
    rr_min: 2.0
    persist_updates: 3
  clear_rr_below: 1.3           # hysteresis
  budget_per_match: 2
  analysis:                     # operating-point analysis (docs/02_MATH.md §7.1)
    rr_level_edges: [1.3, 1.5, 2.0]   # RR levels: <1.3, 1.3-1.5, 1.5-2.0, >=2.0
    updates_per_match: 95
    players_per_team: 11
    replay_agreement_rel: 0.10  # analysis vs replay, expected alerts per team-match
  possible_injury_detection: false
  possible_injury:
    effort_fraction_of_vmax: 0.80
    drop_below_mps: 1.5
    stay_below_mps: 1.0
    stay_s: 8.0
    within_s: 10.0

evaluation:
  primary: m2_vs_m1_logloss     # the one confirmatory hypothesis
  multiplicity: holm            # for every exploratory comparison
  exploratory: [team_relative, ewma_features, decayed_disrupt, movement_pattern, fatigue_hmm]
  input_slope_prior_sd: 0.25    # diagnostic: slope on ln(Lambda) instead of a fixed offset
  tipping_point_max_multiplier: 5.0
  training_sources: [historical, shadow]  # live-mode matches only with alerted players censored

synth:
  burn_in_s: 300
  tick_hz: 10
  zones_mps: [0.0, 0.5, 2.0, 4.0, 5.5, 7.0]   # lower edges: stand, walk, jog, run, hsr, sprint
  jump_matrix:                  # rows: from zone; diagonal zero (staying = dwell time)
    - [0.00, 0.88, 0.10, 0.02, 0.00, 0.00]
    - [0.32, 0.00, 0.60, 0.07, 0.01, 0.00]
    - [0.05, 0.595, 0.00, 0.30, 0.05, 0.005]
    - [0.00, 0.19, 0.565, 0.00, 0.20, 0.045]
    - [0.00, 0.08, 0.40, 0.32, 0.00, 0.20]
    - [0.00, 0.00, 0.35, 0.45, 0.20, 0.00]
  dwell_mean_s: [10.0, 15.0, 8.0, 3.5, 2.4, 2.6]
  dwell_min_s: [1.0, 1.0, 1.0, 0.5, 0.5, 1.0]
  dwell_gamma_shape: [2.0, 1.5, 2.0, 2.0, 2.0, 2.0]
  band_intensity: [1.08, 1.00, 0.95, 0.95, 1.02, 0.95, 0.88, 0.88]  # scales entries into run+
  position_intensity: {CB: 0.80, FB: 1.10, MF: 1.00, W: 1.25, FW: 1.10}  # scales hsr, sprint
  accel_max_mps2: 3.5
  decel_max_mps2: 4.5
  vmax_mean_mps: 8.9
  vmax_sd_mps: 0.35
  vmax_bounds_mps: [8.0, 10.0]
  late_hsr_drop_bounds: [0.10, 0.35]  # band 6 vs band 0 HSR, acceptance range

research:                       # docs/02_MATH.md §14; never in the main fit
  decayed_disrupt_tau_s: 300
  ewma_tau_min: [5, 15]
  movement_pattern_prior_matches: 5

competition:
  live_data_allowed: true

app:
  host: 127.0.0.1
  port: 8765
  roles: [analyst, physio, doctor, coach]

storage:
  log_dir: logs
  data_dir: data

seeds:
  default: 20261022
